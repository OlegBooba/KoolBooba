name: Build KoolBoobaOS ISO

# Запускать скрипт только по кнопке (вручную)
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем файлы из вашего репозитория (скрипт и логотип)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем нужные программы на сервер GitHub
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools unzip

      # 3. Делаем скрипт исполняемым и запускаем его
      - name: Run Build Script
        run: |
          chmod +x build_koolbooba.sh
          sudo ./build_koolbooba.sh

      # 4. Загружаем готовый ISO как артефакт (чтобы вы могли его скачать)
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoolBoobaOS-ISO
          path: koolboobaOS.iso
          retention-days: 7
